name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Public address of the site: used for sitemap.xml, canonical links and the CNAME file
  VITE_SITE_URL: https://otimizacao.js.org
  # Optional (repository → Settings → Secrets and variables → Actions → Variables).
  # Leave VITE_GA_MEASUREMENT_ID unset to use the project's GA4 ID built into the code.
  VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
  VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
